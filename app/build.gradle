plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ascent.esslce'
    compileSdk 34

    defaultConfig {
        applicationId "com.ascent.esslce"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "1.4.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Intentionally empty: the app uses only the Android framework WebView.
}
