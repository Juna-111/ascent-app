name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Ascent-ESSLCE-Android

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Make gradle executable
      run: chmod +x gradlew

    - name: Build debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Ascent-ESSLCE-debug-apk
        path: Ascent-ESSLCE-Android/app/build/outputs/apk/debug/app-debug.apk
