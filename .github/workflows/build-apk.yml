name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ascent-build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Setup Gradle Build Environment
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Validate bundled JavaScript
      run: |
        node --check app/src/main/assets/www/plan-data.js
        node --check app/src/main/assets/www/portion-data.js
        node --check app/src/main/assets/www/app.js
        node --check app/src/main/assets/www/mission-enhancements.js
        node scripts/validate-study-data.js

    - name: Compile and lint Android app
      run: gradle assembleDebug lintDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Ascent-ESSLCE-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
